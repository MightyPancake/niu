# niu CI: build niu with every supported compiler on Linux, macOS and
# Windows, and run tests/run.sh against libclang. Every action, image and
# tool is pinned; nothing is allowed to fail.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.cc }} / libclang ${{ matrix.libclang }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-13, clang-18, tcc]
        # 18 is the oldest supported (Ubuntu's own package); 23.1.6 is the
        # newest LLVM release (the official build from llvm-project).
        libclang: ["18", "23.1.6"]
    env:
      NIU_TEST_CC: gcc-13 clang-18 tcc
      LLVM_LINUX_SHA256: bd4d1c434ff69ef06d19e7934c04708da677e5f2eb51f5bcf052ab91818f0094
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install compilers and libclang 18 (pinned)
        run: |
          sudo apt-get update
          v18=1:18.1.3-1ubuntu1
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            gcc-13=13.3.0-6ubuntu2~24.04.1 \
            tcc=0.9.27+git20200814.62c30a4a-1 \
            clang-18=$v18 libclang1-18=$v18 libclang-common-18-dev=$v18 \
            libclang-cpp18=$v18 libllvm18=$v18 llvm-18-linker-tools=$v18
          gcc-13 --version | head -1
          clang-18 --version | head -1
          tcc -v

      - name: Cache libclang ${{ matrix.libclang }}
        if: matrix.libclang != '18'
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/libclang-${{ matrix.libclang }}
          key: libclang-${{ matrix.libclang }}-linux-x64

      - name: Download libclang ${{ matrix.libclang }} (official LLVM release)
        if: matrix.libclang != '18' && steps.cache.outputs.cache-hit != 'true'
        env:
          V: ${{ matrix.libclang }}
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$V/LLVM-$V-Linux-X64.tar.xz"
          echo "$LLVM_LINUX_SHA256  llvm.tar.xz" | sha256sum -c -
          mkdir -p ~/libclang-"$V"
          # Only libclang and its resource headers (stddef.h and friends).
          tar -xJf llvm.tar.xz -C ~/libclang-"$V" --strip-components=1 --wildcards \
            "LLVM-$V-Linux-X64/lib/libclang.so*" "LLVM-$V-Linux-X64/lib/clang/*/include"
          rm llvm.tar.xz
          ls -l ~/libclang-"$V"/lib

      - name: Use libclang ${{ matrix.libclang }}
        if: matrix.libclang != '18'
        env:
          V: ${{ matrix.libclang }}
        run: |
          lib=$HOME/libclang-$V/lib/libclang.so
          test -e "$lib"
          test -f "$HOME/libclang-$V/lib/clang/${V%%.*}/include/stddef.h"
          ldd "$lib"
          echo "NIU_LIBCLANG=$lib" >> "$GITHUB_ENV"

      - name: Build niu (cc niu.c -o niu)
        run: ${{ matrix.cc }} niu.c -o niu

      - name: Build niu with warnings as errors
        run: |
          case "${{ matrix.cc }}" in
          tcc) tcc -Wall -Werror niu.c -o niu-strict ;;
          *) ${{ matrix.cc }} -std=c99 -Wall -Wextra -Wpedantic -Wvla -Werror niu.c -o niu-strict ;;
          esac

      - name: Check which libclang niu loads
        run: |
          ./niu --version | tee version.txt
          grep -F "clang version ${{ matrix.libclang }}" version.txt

      - name: Test
        run: bash tests/run.sh ./niu

  macos:
    name: macOS / Apple clang / Xcode 16.4 libclang
    runs-on: macos-15
    env:
      # Selects Xcode 16.4 for xcrun, cc and niu's libclang search alike.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NIU_TEST_CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show the toolchain
        run: |
          xcodebuild -version
          clang --version
          ls -l "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib"

      - name: Build niu (cc niu.c -o niu)
        run: clang niu.c -o niu

      - name: Build niu with warnings as errors
        run: clang -std=c99 -Wall -Wextra -Wpedantic -Wvla -Werror niu.c -o niu-strict

      - name: Check which libclang niu loads
        run: |
          ./niu --version | tee version.txt
          grep -F "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/lib/libclang.dylib" version.txt

      - name: Test
        run: bash tests/run.sh ./niu

  windows:
    name: Windows / ${{ matrix.cc }} / LLVM 20.1.8
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cc: [cl, clang]
    env:
      NIU_TEST_CC: cl clang
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image ships LLVM 20.1.8 in C:\Program Files\LLVM; this pins it
      # (a no-op while the image has exactly this version).
      - name: Install LLVM 20.1.8 (pinned)
        shell: pwsh
        run: choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Show the toolchain
        run: |
          command -v cl clang
          cl 2>&1 | head -1
          clang --version

      - name: Build niu (cl niu.c / clang niu.c)
        run: |
          case "${{ matrix.cc }}" in
          cl) cl -nologo niu.c ;;
          clang) clang niu.c -o niu.exe ;;
          esac

      - name: Build niu with warnings as errors
        run: |
          case "${{ matrix.cc }}" in
          cl) cl -nologo -W4 -WX niu.c -Fe:niu-strict.exe ;;
          clang) clang -std=c99 -Wall -Wextra -Wpedantic -Wvla -Werror niu.c -o niu-strict.exe ;;
          esac

      - name: Check which libclang niu loads
        run: |
          ./niu.exe --version | tee version.txt
          grep -F 'LLVM\bin\libclang.dll' version.txt
          grep -F 'clang version 20.1.8' version.txt

      - name: Test
        run: bash tests/run.sh ./niu.exe
